[project]
name = "ai-governance-intelligence-platform"
version = "0.1.0"
description = "Governance-as-code MVP: rule authoring, CALM app generation, governance execution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "pyyaml",
    "pydantic>=2",
    "pydantic-settings>=2",
    "jsonschema",
    "referencing",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "boto3",
    "strands-agents",
    "botocore[crt]>=1.44.4",
]

[project.optional-dependencies]
pglite = ["py-pglite", "psycopg[binary]"]
[dependency-groups]
dev = ["pytest", "hypothesis", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "shared/src/agip_shared",
    "rule-authoring-framework/src/rule_authoring",
    "calm-app-generation-framework/src/calm_generation",
    "governance-execution-framework/src/governance_execution",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "shared/tests",
    "rule-authoring-framework/tests",
    "calm-app-generation-framework/tests",
    "governance-execution-framework/tests",
]
pythonpath = [
    "shared/src",
    "rule-authoring-framework/src",
    "calm-app-generation-framework/src",
    "governance-execution-framework/src",
]
addopts = "--import-mode=importlib"
markers = [
    "acceptance: standalone acceptance suite of one framework (run alone with -m acceptance)",
]
