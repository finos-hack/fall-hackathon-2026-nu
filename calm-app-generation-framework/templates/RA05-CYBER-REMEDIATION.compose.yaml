# Generated by the RA agent from published patterns (P08 P11 P12 P14 P15 P16); approval option balanced by review.
ra_id: RA05-CYBER-REMEDIATION
version: 1
title: Cyber Remediation Agent
description: An AI agent investigates security alerts read from an alert store, uses a hosted language model for analysis,
  and applies remediation actions to production hosts through a remediation tool. Each remediation either needs approval by
  a security analyst in the human approval service before it is applied, or the agent applies it directly. Every agent decision
  can be recorded in an audit trail.
patterns:
- P08
- P11
- P12
- P14
- P15
- P16
components:
- id: alert-store
  from:
  - P08/data-store
  name: Alert Store
  description: Structured persistent data store for security alerts.
  bind:
    access_control: rbac
    encryption_at_rest: enabled
- id: remediation-agent
  from:
  - P12/agent
  - P14/agent
  - P15/agent
  name: Remediation Agent
  description: AI agent that investigates security alerts and applies remediation actions.
  bind:
    privilege: restricted-write
    permitted_tools: remediation-tool
    credential_storage: vault
    observability: enabled
    acceptance_testing: completed
    input_filtering: enabled
    decision_impact: high
    action_capability: production-change
- id: foundation-model
  from:
  - P11/foundation-model
  name: Foundation Model
  description: Hosted language model used for analysis.
  bind:
    guardrails: enabled
    sensitive_data_filtering: enabled
- id: remediation-tool
  from:
  - P12/tool
  - P16/remediation-tool
  name: Remediation Tool
  description: Tool that applies remediation actions to production hosts.
  bind:
    input_validation: enforced
    remediation_scope: allow-listed
- id: host-fleet
  from:
  - P16/host-fleet
  name: Host Fleet
  description: Production hosts that can receive remediation actions.
  bind:
    environment: production
    host_tagging: enforced
- id: human-approval-service
  from:
  - P15/human-approval
  name: Human Approval Service
  description: Security analyst reviews remediation actions before they are applied.
- id: audit-service
  from:
  - P14/audit-service
  name: Audit Service
  description: Records every agent decision and remediation action.
  option: opt-audit
relationships:
- id: r-alert-store-to-agent
  from: P08/consumer-reads-store
  map:
    data-consumer: remediation-agent
    data-store: alert-store
  description: Agent reads security alerts from the alert store
- id: r-agent-to-model
  from: P11/consumer-calls-model
  map:
    model-consumer: remediation-agent
    foundation-model: foundation-model
  description: Agent uses the foundation model for analysis
- id: r-agent-uses-tool
  from: P12/agent-uses-tool
  map:
    agent: remediation-agent
    tool: remediation-tool
  description: Agent uses the remediation tool to apply actions
- id: r-tool-changes-hosts
  from: P16/tool-changes-hosts
  map:
    remediation-tool: remediation-tool
    host-fleet: host-fleet
  description: Remediation tool applies actions to the host fleet
- id: r-agent-requests-approval
  from: P15/agent-requests-approval
  map:
    agent: remediation-agent
    human-approval: human-approval-service
  option: opt-approval-path
  description: Agent requests approval from the human approval service
- id: r-agent-is-audited
  from: P14/agent-is-audited
  map:
    agent: remediation-agent
    audit-service: audit-service
  option: opt-audit
  description: Agent decisions are recorded in the audit service
- id: r-approval-releases-tool
  connects:
  - human-approval-service
  - remediation-tool
  option: opt-approval-path
  description: Approved actions are released to the remediation tool
- id: r-direct-tool-use
  connects:
  - remediation-agent
  - remediation-tool
  option: opt-approval-path
  description: Agent directly uses the remediation tool without approval
- id: r-tool-reports-to-analyst
  connects:
  - remediation-tool
  - human-approval-service
  option: opt-approval-path
  description: Remediation tool reports applied actions to the analyst after the fact
options:
- id: opt-approval-path
  type: oneOf
  description: How are remediation actions approved?
  choices:
  - description: Actions require human approval
    relationships:
    - r-agent-requests-approval
    - r-approval-releases-tool
  - description: Actions are applied directly
    relationships:
    - r-direct-tool-use
    - r-tool-reports-to-analyst
- id: opt-audit
  type: anyOf
  description: Is an audit service present?
  choices:
  - description: Audit service present
    nodes:
    - audit-service
    relationships:
    - r-agent-is-audited
  - description: No audit service
    nodes: []
    relationships: []
