# Control_Rules_Catalog. One definition per control (merged from catalogs/seed/registry.yaml and seed/rules/*.yaml).
# Catalog-only fields (severity, mandatory, remediation) live here and join to Spectral results by Rule_Code.
# Spectral rule bodies are defined once, under `spectral_rules` of the item that owns the Rule_Code.
# Severity labels are "illustrative, not approved policy"; Spectral passes are design-level evidence only.
#
# CALM metadata vocabulary used by the rules (set by the RA03-LITE template, calm-app-generation-framework):
#   ai:agent   autonomy (supervised|semi-autonomous|autonomous), privilege (read-only|restricted-write|unrestricted-write),
#              can_execute_payment (bool), payment_approval_path (via-human-approval|direct),
#              credential_storage (vault|inline), observability (enabled|none), acceptance_testing (completed|none),
#              input_filtering (enabled|none)
#   ai:llm     model_version (pinned|floating), guardrails (enabled|none), sensitive_data_filtering (enabled|none)
#   ai:tool    input_validation (enforced|none), mcp_server (governed|ungoverned)
#   service    role (api-gateway|invoice-processing|human-approval|audit|payment-api), exposure (internal|external),
#              mediation (gateway|none)
#   database   data_classification, access_control (rbac|none), encryption_at_rest (enabled|none)
#
# Merge decisions (also in docs/deliberate-changes.md):
#   - Registry severity wins over the rule-file severity; it is kept as registry_severity. The enforced severity is per
#     configuration (below), so a missing audit service can be a minor gap while a missing approval gate is critical.
#   - seed rule EXTERNAL-CONNECTIVITY-CONTROL-001 had no registry entry and duplicated AIGF mi-17; it is merged into
#     AIGF-MI-017 (one definition).
#   - AIGF-MI-024 (human-in-the-loop approval gate) is new for the MVP; the draft repo had no control for it.
catalog: controls
version: 5
label: illustrative, not approved policy
items:
- control_id: AIGF-MI-024
  title: Human-in-the-Loop Action Approval Gate
  version: 2
  type: control
  status: APPROVED
  approved_by: seed-import
  approved_at: '2026-01-01T00:00:00+00:00'
  history:
  - from: DRAFT
    to: IN_REVIEW
    by: seed-import
    role: seed
    rationale: seed import
    at: '2026-01-01T00:00:00+00:00'
    version: 1
  - from: IN_REVIEW
    to: APPROVED
    by: seed-import
    role: seed
    rationale: seed import
    at: '2026-01-01T00:00:00+00:00'
    version: 1
  - from: APPROVED
    to: APPROVED
    by: cyber-remediation-build
    role: governance_admin
    rationale: added CFG-HITL-PRODUCTION for production-changing agents (cyber remediation)
    at: '2026-11-18T12:46:10.209131+00:00'
    version: 2
  source:
    framework: AIGF
    id: mi-24
    path: docs/_mitigations/mi-24_*.md
  references:
  - framework: NIST
    id: AC-6
  registry_id: null
  registry_severity: null
  applicability:
    facts:
    - agent_can_perform_high_impact_action
  configurations:
  - id: CFG-HITL-PAYMENT
    mandatory: true
    severity: critical
    rule_codes:
    - ctl-payment-requires-human-approval
    remediation: Route every Payment Agent call to the Payment API through the Human
      Approval Service.
  - id: CFG-HITL-PRODUCTION
    mandatory: true
    severity: critical
    rule_codes:
    - ctl-production-change-requires-approval
    remediation: Route every production-changing action of the agent through the Human
      Approval Service.
  spectral_rules:
    ctl-payment-requires-human-approval:
      description: Payment-executing agents must route payments through human approval
      message: Payment agent at {{path}} does not use the human approval path (AIGF
        mi-24)
      severity: error
      given: $.nodes[?(@['node-type']=='ai:agent' && @.metadata.can_execute_payment==true)].metadata
      then:
        field: payment_approval_path
        function: pattern
        functionOptions:
          match: ^via-human-approval$
    ctl-production-change-requires-approval:
      description: Production-changing agents act only after human approval
      message: Agent at {{path}} changes production without the human approval path
        (AIGF mi-24)
      severity: error
      given: $.nodes[?(@['node-type']=='ai:agent' && @.metadata.action_capability=='production-change')].metadata
      then:
        field: action_approval_path
        function: pattern
        functionOptions:
          match: ^via-human-approval$
- control_id: AIGF-MI-018
  title: Agent Authority Least Privilege Framework
  version: 2
  type: control
  status: APPROVED
  approved_by: seed-import
  approved_at: '2026-01-01T00:00:00+00:00'
  history:
  - from: DRAFT
    to: IN_REVIEW
    by: seed-import
    role: seed
    rationale: seed import
    at: '2026-01-01T00:00:00+00:00'
    version: 1
  - from: IN_REVIEW
    to: APPROVED
    by: seed-import
    role: seed
    rationale: seed import
    at: '2026-01-01T00:00:00+00:00'
    version: 1
  - from: APPROVED
    to: APPROVED
    by: cyber-remediation-build
    role: governance_admin
    rationale: added CFG-REMEDIATION-SCOPE for production-changing agents (cyber remediation)
    at: '2026-11-18T12:46:10.209131+00:00'
    version: 2
  source:
    framework: AIGF
    id: mi-18
    path: docs/_mitigations/mi-18_*.md
  references:
  - framework: NIST
    id: AC-6
  - framework: NIST
    id: AC-3
  registry_id: AGENT-ACTION-001
  registry_severity: critical
  applicability:
    facts:
    - agent_has_external_action
    - agent_can_perform_high_impact_action
  configurations:
  - id: CFG-LEAST-PRIVILEGE
    mandatory: false
    severity: high
    rule_codes:
    - ctl-agent-least-privilege
    remediation: Restrict each agent to read-only or restricted-write privilege; remove
      unrestricted write access to downstream APIs.
  - id: CFG-REMEDIATION-SCOPE
    mandatory: false
    severity: high
    rule_codes:
    - ctl-remediation-allow-listed
    - ctl-hosts-tagged
    remediation: Limit the remediation tool to the allow-listed actions and apply
      them only to tagged hosts.
  spectral_rules:
    ctl-agent-least-privilege:
      description: Agents must not hold unrestricted write privilege
      message: Agent at {{path}} has unrestricted write privilege (AIGF mi-18)
      severity: error
      given: $.nodes[?(@['node-type']=='ai:agent')].metadata
      then:
        field: privilege
        function: pattern
        functionOptions:
          match: ^(read-only|restricted-write)$
    ctl-remediation-allow-listed:
      description: Remediation tools run only allow-listed actions
      message: Remediation tool at {{path}} is not limited to allow-listed actions
        (AIGF mi-18)
      severity: error
      given: $.nodes[?(@['node-type']=='ai:tool' && @.metadata.remediation_scope)].metadata
      then:
        field: remediation_scope
        function: pattern
        functionOptions:
          match: ^allow-listed$
    ctl-hosts-tagged:
      description: Remediation targets only tagged hosts
      message: Host fleet at {{path}} does not enforce remediation tagging (AIGF mi-18)
      severity: error
      given: $.nodes[?(@['node-type']=='system' && @.metadata.host_tagging)].metadata
      then:
        field: host_tagging
        function: pattern
        functionOptions:
          match: ^enforced$
