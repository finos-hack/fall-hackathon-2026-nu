    by: seed-import
    role: seed
    rationale: seed import
    at: '2026-01-01T00:00:00+00:00'
    version: 1
  - from: APPROVED
    to: APPROVED
    by: cyber-remediation-build
    role: governance_admin
    rationale: added risk-production-change-without-approval (cyber remediation)
    at: '2026-11-18T12:46:10.271281+00:00'
    version: 2
  source:
    framework: AIGF
    id: ri-24
    path: docs/_risks/ri-24_*.md
  references: []
  dimension: Privilege & Capability
  likelihood: 3
  impact: 5
  confirmation:
    likelihood: 3
    impact: 5
    by: seed-import
    role: seed
    at: '2026-01-01T00:00:00+00:00'
    note: seed value accepted at import; not an approved policy judgement
  mandatory_trigger: true
  rule_codes:
  - risk-payment-bypasses-approval
  - risk-production-change-without-approval
  remediation: Route every payment through the Human Approval Service and remove the
    direct Payment API path.
  spectral_rules:
    risk-payment-bypasses-approval:
      description: A payment-executing agent can reach the Payment API without approval
      message: Agent at {{path}} reaches the Payment API directly (AIGF ri-24)
      severity: error
      given: $.nodes[?(@['node-type']=='ai:agent' && @.metadata.can_execute_payment==true)].metadata
      then:
        field: payment_approval_path
        function: pattern
        functionOptions:
          notMatch: ^direct$
    risk-production-change-without-approval:
      description: A production-changing agent acts without human approval
      message: Agent at {{path}} changes production directly (AIGF ri-24)
      severity: error
      given: $.nodes[?(@['node-type']=='ai:agent' && @.metadata.action_capability=='production-change')].metadata
      then:
        field: action_approval_path
        function: pattern
        functionOptions:
          notMatch: ^direct$
