# controls ruleset
# version: 1
# source catalog: controls v1
# rules: 12 (APPROVED only)
# generated by rule_authoring.compile; do not edit
# custom functions: none (core functions only)
rules:
  ctl-agent-acceptance-tested:
    description: Agents must have completed acceptance testing
    message: Agent at {{path}} has not completed acceptance testing (AIGF mi-5)
    severity: error
    given: $.nodes[?(@['node-type']=='ai:agent')].metadata
    then:
      field: acceptance_testing
      function: pattern
      functionOptions:
        match: ^completed$
  ctl-agent-least-privilege:
    description: Agents must not hold unrestricted write privilege
    message: Agent at {{path}} has unrestricted write privilege (AIGF mi-18)
    severity: error
    given: $.nodes[?(@['node-type']=='ai:agent')].metadata
    then:
      field: privilege
      function: pattern
      functionOptions:
        match: ^(read-only|restricted-write)$
  ctl-agent-observability:
    description: Agents must emit observability data
    message: Agent at {{path}} has no observability (AIGF mi-4)
    severity: error
    given: $.nodes[?(@['node-type']=='ai:agent')].metadata
    then:
      field: observability
      function: pattern
      functionOptions:
        match: ^enabled$
  ctl-audit-service-present:
    description: The architecture must contain an audit service
    message: No node with metadata.role 'audit' found (AIGF mi-21)
    severity: error
    given: $
    then:
      field: nodes
      function: schema
      functionOptions:
        schema:
          type: array
          contains:
            type: object
            required:
            - metadata
            properties:
              metadata:
                type: object
                required:
                - role
                properties:
                  role:
                    const: audit
  ctl-data-access-rbac:
    description: Datastores must enforce role-based access control
    message: Datastore at {{path}} has no RBAC (AIGF mi-12)
    severity: error
    given: $.nodes[?(@['node-type']=='database')].metadata
    then:
      field: access_control
      function: pattern
      functionOptions:
        match: ^rbac$
  ctl-data-encrypted-at-rest:
    description: Datastores must be encrypted at rest
    message: Datastore at {{path}} is not encrypted at rest (CCC.KMS)
    severity: error
    given: $.nodes[?(@['node-type']=='database')].metadata
    then:
      field: encryption_at_rest
      function: pattern
      functionOptions:
        match: ^enabled$
  ctl-external-service-mediated:
    description: External-facing services must be mediated by a gateway
    message: External service at {{path}} is not mediated by a gateway (CCC.VPC)
    severity: error
    given: $.nodes[?(@['node-type']=='service' && @.metadata.exposure=='external')].metadata
    then:
      field: mediation
      function: pattern
      functionOptions:
        match: ^gateway$
  ctl-model-guardrails-enabled:
    description: Foundation models must sit behind guardrails
    message: Model at {{path}} has no guardrails (AIGF mi-17)
    severity: error
    given: $.nodes[?(@['node-type']=='ai:llm')].metadata
    then:
      field: guardrails
      function: pattern
      functionOptions:
        match: ^enabled$
  ctl-no-inline-credentials:
    description: Agent credentials must not be stored inline
    message: Agent at {{path}} stores credentials inline (AIGF mi-23)
    severity: error
    given: $.nodes[?(@['node-type']=='ai:agent')].metadata
    then:
      field: credential_storage
      function: pattern
      functionOptions:
        notMatch: ^inline$
  ctl-payment-requires-human-approval:
    description: Payment-executing agents must route payments through human approval
    message: Payment agent at {{path}} does not use the human approval path (AIGF mi-24)
    severity: error
    given: $.nodes[?(@['node-type']=='ai:agent' && @.metadata.can_execute_payment==true)].metadata
    then:
      field: payment_approval_path
      function: pattern
      functionOptions:
        match: ^via-human-approval$
  ctl-tool-input-validation:
    description: Tools must validate inputs
    message: Tool at {{path}} does not enforce input validation (AIGF mi-19)
    severity: error
    given: $.nodes[?(@['node-type']=='ai:tool')].metadata
    then:
      field: input_validation
      function: pattern
      functionOptions:
        match: ^enforced$
  ctl-tool-server-governed:
    description: Tool servers must be governed
    message: Tool at {{path}} uses an ungoverned server (AIGF mi-20)
    severity: error
    given: $.nodes[?(@['node-type']=='ai:tool')].metadata
    then:
      field: mcp_server
      function: pattern
      functionOptions:
        notMatch: ^ungoverned$
