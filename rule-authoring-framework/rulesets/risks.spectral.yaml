# risks ruleset
# version: 4
# source catalog: risks v4
# rules: 9 (APPROVED only)
# generated by rule_authoring.compile; do not edit
# custom functions: none (core functions only)
rules:
  risk-agent-autonomous-execution:
    description: Agent runs with autonomy=autonomous
    message: Agent at {{path}} is autonomous (AIGF ri-18)
    severity: error
    given: $.nodes[?(@['node-type']=='ai:agent')].metadata
    then:
      field: autonomy
      function: pattern
      functionOptions:
        notMatch: ^autonomous$
  risk-model-version-floating:
    description: Foundation model version is not pinned
    message: Model at {{path}} is not version-pinned (AIGF ri-5)
    severity: error
    given: $.nodes[?(@['node-type']=='ai:llm')].metadata
    then:
      field: model_version
      function: pattern
      functionOptions:
        match: ^pinned$
  risk-no-audit-trail:
    description: No audit trail exists for agent decisions
    message: No node with metadata.role 'audit' found (AIGF ri-22)
    severity: error
    given: $
    then:
      field: nodes
      function: schema
      functionOptions:
        schema:
          type: array
          contains:
            type: object
            required:
            - metadata
            properties:
              metadata:
                type: object
                required:
                - role
                properties:
                  role:
                    const: audit
  risk-payment-bypasses-approval:
    description: A payment-executing agent can reach the Payment API without approval
    message: Agent at {{path}} reaches the Payment API directly (AIGF ri-24)
    severity: error
    given: $.nodes[?(@['node-type']=='ai:agent' && @.metadata.can_execute_payment==true)].metadata
    then:
      field: payment_approval_path
      function: pattern
      functionOptions:
        notMatch: ^direct$
  risk-production-change-without-approval:
    description: A production-changing agent acts without human approval
    message: Agent at {{path}} changes production directly (AIGF ri-24)
    severity: error
    given: $.nodes[?(@['node-type']=='ai:agent' && @.metadata.action_capability=='production-change')].metadata
    then:
      field: action_approval_path
      function: pattern
      functionOptions:
        notMatch: ^direct$
  risk-sensitive-data-to-model:
    description: Sensitive data may reach the hosted model unfiltered
    message: Model at {{path}} has no sensitive-data filtering (AIGF ri-1)
    severity: error
    given: $.nodes[?(@['node-type']=='ai:llm')].metadata
    then:
      field: sensitive_data_filtering
      function: pattern
      functionOptions:
        match: ^enabled$
  risk-untrusted-input-unfiltered:
    description: Agent reads untrusted input without filtering
    message: Agent at {{path}} has no input filtering (AIGF ri-10)
    severity: error
    given: $.nodes[?(@['node-type']=='ai:agent')].metadata
    then:
      field: input_filtering
      function: pattern
      functionOptions:
        match: ^enabled$
  risk-upl-customer-misinformation:
    description: Ensure that agents have human oversight for customer replies to prevent incorrect or misleading statements.
    message: '{{path}}: Ensure that agents have human oversight for customer replies to prevent incorrect or misleading statements.'
    severity: error
    given: $.nodes[?(@['node-type']=='ai:agent')].metadata
    then:
      field: action_approval_path
      function: enumeration
      functionOptions:
        values:
        - via-human-approval
  risk-upl-unapproved-claim-payout:
    description: Ensures that AI agents settling insurance claims require human approval before releasing payouts.
    message: '{{path}}: Ensures that AI agents settling insurance claims require human approval before releasing payouts.'
    severity: error
    given: $.nodes[?(@['node-type']=='ai:agent')].metadata
    then:
      field: payment_approval_path
      function: enumeration
      functionOptions:
        values:
        - via-human-approval
