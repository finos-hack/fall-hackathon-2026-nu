# Risk_Rules_Catalog: one rule per AIGF risk used by the Invoice-Lite app. Dimension triggers are Spectral rules over
# CALM metadata (vocabulary in controls.catalog.yaml). Severity is NOT stored here: it is computed from
# likelihood x impact through governance-execution-framework/config/scoring_profile.yaml ("illustrative, not approved policy").
catalog: risks
version: 2
label: illustrative, not approved policy
items:
- risk_id: AIGF-RI-018
  title: Model Overreach / Expanded Use
  version: 1
  type: risk
  status: APPROVED
  approved_by: seed-import
  approved_at: '2026-01-01T00:00:00+00:00'
  history:
  - from: DRAFT
    to: IN_REVIEW
    by: seed-import
    role: seed
    rationale: seed import
    at: '2026-01-01T00:00:00+00:00'
    version: 1
  - from: IN_REVIEW
    to: APPROVED
    by: seed-import
    role: seed
    rationale: seed import
    at: '2026-01-01T00:00:00+00:00'
    version: 1
  source:
    framework: AIGF
    id: ri-18
    path: docs/_risks/ri-18_*.md
  references: []
  dimension: Autonomy
  likelihood: 4
  impact: 4
  confirmation:
    likelihood: 4
    impact: 4
    by: seed-import
    role: seed
    at: '2026-01-01T00:00:00+00:00'
    note: seed value accepted at import; not an approved policy judgement
  mandatory_trigger: true
  rule_codes:
  - risk-agent-autonomous-execution
  remediation: Require human approval or restrict agent autonomy to supervised.
  spectral_rules:
    risk-agent-autonomous-execution:
      description: Agent runs with autonomy=autonomous
      message: Agent at {{path}} is autonomous (AIGF ri-18)
      severity: error
      given: $.nodes[?(@['node-type']=='ai:agent')].metadata
      then:
        field: autonomy
        function: pattern
        functionOptions:
          notMatch: ^autonomous$
- risk_id: AIGF-RI-024
